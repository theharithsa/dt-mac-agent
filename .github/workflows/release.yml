name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -s bash bin/dt-mac-agent bin/dt-mac-watchdog bin/dtmacctl lib/*.sh install.sh uninstall.sh

      - name: Build archive
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$V" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          D="dt-mac-agent-$V"
          mkdir -p "dist/$D"
          cp -R bin lib launchd etc Dashboard install.sh uninstall.sh VERSION README.md CHANGELOG.md troubleshooting.md LICENSE "dist/$D/"
          tar -C dist -czf "dist/$D.tar.gz" "$D"
          (cd dist && sha256sum "$D.tar.gz" > "$D.tar.gz.sha256")
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/dt-mac-agent-$V.tar.gz" "dist/dt-mac-agent-$V.tar.gz.sha256" \
            --title "dt-mac-agent $V" --notes-file dist/notes.md
